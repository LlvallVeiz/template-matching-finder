[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-matching-finder"
version = "1.0.0"
description = "Template matching from scratch with NumPy + Pillow (SSD, SAD, NCC, ZNCC, NMS, multi-scale, rotation) — no OpenCV."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tmf = "template_matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
